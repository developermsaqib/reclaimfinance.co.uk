<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reclaims Finance | Thank You</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main data-pxl="_n47">
        <div class="flex items-center justify-center h-screen" data-pxl="_n48">
            <div class="p-1 rounded shadow-lg bg-gradient-to-r from-blue-900 to-purple-600" data-pxl="_n49">
                <div class="flex flex-col items-center md:p-4 p-2 space-y-2 bg-white" data-pxl="_n50">
                    <div id="default-success" class="text-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="text-green-600 w-28 h-28" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor" stroke-width="1" data-pxl="_n51">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" data-pxl="_n52"></path>
                        </svg>
                        <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-900 to-purple-600"
                            data-pxl="_n53">Thank You!</h1>
                        <p class="py-5" data-pxl="_n54">We have received your details. One of our agents will be in touch
                            soon.</p>
                    </div>
                    
                    <div id="check-email" class="text-center hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" class="text-blue-600 w-28 h-28 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" 
                                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                        <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-900 to-purple-600">
                            Check Your Email</h1>
                        <p class="py-5">We've sent you an email with a link to complete your submission. Please check your inbox and click the link to continue.</p>
                        <p class="text-sm text-gray-600">If you don't see the email, please check your spam folder.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if URL has #check-email hash
            if (window.location.hash === '#check-email') {
                document.getElementById('default-success').classList.add('hidden');
                document.getElementById('check-email').classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
